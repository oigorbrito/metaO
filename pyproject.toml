[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metao-control-plane"
version = "0.1.0"
description = "Framework-neutral meta-orchestrator control plane"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
metao = "metao.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
