name: Operator Initialization E2E Windows

on:
  pull_request:
    paths:
      - '.github/workflows/operator-initialization-e2e-windows.yml'
      - 'src/metao/**'
      - 'tests/integration/test_operator_initialization_e2e.py'
  workflow_dispatch:

jobs:
  initialization-e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and real bootstrap runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11'
      - name: Verify installed CLI
        shell: pwsh
        run: |
          Get-Command metao
          metao --help
      - name: Bootstrap to accepted mission E2E
        run: python tests/integration/test_operator_initialization_e2e.py
