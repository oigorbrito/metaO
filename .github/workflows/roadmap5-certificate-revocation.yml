name: Roadmap 5 Certificate Revocation

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap5-certificate-revocation.yml'
      - 'src/metao/runtime_certification_revocation.py'
      - 'src/metao/sqlite_runtime_certification_revocation.py'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_factory.py'
      - 'tests/unit/test_roadmap_5_work_unit_02.py'
      - 'docs/ROADMAP-5-WU02-DURABLE-CERTIFICATE-REVOCATION.md'
  workflow_dispatch:

jobs:
  certificate-revocation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Roadmap 5 WU02 focused tests
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_02 -v
      - name: Roadmap 5 WU01 freshness regression
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_01 -v
      - name: Roadmap 4 reuse regression
        run: python -m unittest tests.unit.test_roadmap_4_work_unit_02 -v
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral control-plane boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
