name: Roadmap 2 Durable Runtime Quarantine

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap2-runtime-quarantine.yml'
      - 'src/metao/runtime_control.py'
      - 'src/metao/sqlite_runtime_control.py'
      - 'src/metao/governed_catalog.py'
      - 'src/metao/runtime_factory.py'
      - 'tests/unit/test_roadmap_2_work_unit_03.py'
      - 'docs/ROADMAP-2-WU03-DURABLE-RUNTIME-QUARANTINE.md'

jobs:
  runtime-quarantine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU03 durable runtime quarantine evidence
        run: python tests/unit/test_roadmap_2_work_unit_03.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral runtime control boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai)' src/metao/runtime_control.py src/metao/sqlite_runtime_control.py src/metao/governed_catalog.py src/metao/runtime_factory.py
