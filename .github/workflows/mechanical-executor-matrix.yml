name: Mechanical Executor Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mechanical-executor-matrix.yml'
      - 'scripts/run_mechanical_executor_matrix.py'
      - 'src/metao/observed_performance.py'
      - 'src/metao/observed_performance_store.py'
      - 'src/metao/entrypoint.py'
      - 'src/metao/adapters/openai_agents.py'
      - 'src/metao/adapters/crewai.py'
      - 'src/metao/adapters/langgraph.py'
      - 'tests/integration/_openai_agents_model.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanical-executor-matrix:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install metaO and pinned real SDK runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'openai-agents==0.20.0' 'crewai==1.15.16' 'langgraph==1.2.11'

      - name: Execute provider-free real SDK matrix
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_mechanical_executor_matrix.py \
            --commit "$EXACT_HEAD_SHA" \
            --output-dir .artifacts/mechanical-executor-matrix

      - name: Import all observations through canonical CLI
        run: |
          DB=.artifacts/mechanical-executor-matrix/evidence.db
          for file in .artifacts/mechanical-executor-matrix/*.observed.json; do
            metao --db "$DB" observed-performance-import "$file"
          done
          metao --db "$DB" runtime-observed-performance openai-agents-real > .artifacts/mechanical-executor-matrix/openai-imported.json
          metao --db "$DB" runtime-observed-performance crewai-real > .artifacts/mechanical-executor-matrix/crewai-imported.json
          metao --db "$DB" runtime-observed-performance langgraph-real > .artifacts/mechanical-executor-matrix/langgraph-imported.json

      - name: Validate matrix and canonical ingestion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.artifacts/mechanical-executor-matrix')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['classification'] == 'PROVIDER_FREE_REAL_SDK_RUNTIME_OVERHEAD'
          assert manifest['repetitions_per_cell'] == 5
          assert len(manifest['executors']) == 3
          assert len(manifest['task_families']) == 3
          assert len(manifest['samples']) == 45
          claims = manifest['claims']
          assert claims['three_real_sdk_harnesses'] == 'EXECUTED'
          assert claims['provider_calls'] == 'NOT_EXECUTED'
          assert claims['provider_cost'] == 'NOT_MEASURED'
          assert claims['model_quality'] == 'NOT_MEASURED'
          for name in ('openai-imported.json', 'crewai-imported.json', 'langgraph-imported.json'):
              rows = json.loads((root / name).read_text())
              assert len(rows) == 3
              assert {row['task_family'] for row in rows} == {
                  'coding_fixture', 'terminal_fixture', 'tool_api_fixture'
              }
              assert all(row['sample_count'] == 5 for row in rows)
              assert all(
                  next(metric['value'] for metric in row['metrics'] if metric['name'] == 'success_rate') == 1.0
                  for row in rows
              )
          print('mechanical executor matrix canonical ingestion: PASS')
          PY

      - name: Three-real-runtime regression
        run: python tests/integration/test_r6_wu05_three_real_runtimes.py

      - name: Observed-performance regression
        run: |
          python -m unittest \
            tests/unit/test_observed_performance_evidence.py \
            tests/unit/test_empirical_selection.py \
            tests/unit/test_observed_performance_runtime_factory.py -v

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mechanical-executor-matrix-${{ github.run_id }}
          path: .artifacts/mechanical-executor-matrix
          if-no-files-found: error
