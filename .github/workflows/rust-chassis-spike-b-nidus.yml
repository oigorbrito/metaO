name: Rust chassis spike B Nidus

on:
  push:
    branches:
      - test/rust-chassis-spike-b-nidus-v1
  pull_request:
    branches:
      - main
    paths:
      - experiments/rust-chassis-b-nidus/**
      - .github/workflows/rust-chassis-spike-b-nidus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/rust-chassis-b-nidus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format gate
        run: cargo fmt --all --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Qualification tests
        run: cargo test --workspace --all-targets --verbose
      - name: Dependency graph
        run: cargo tree --workspace
