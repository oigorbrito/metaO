name: Roadmap 3 Runtime Admission Gate

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap3-runtime-admission.yml'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_conformance.py'
      - 'tests/unit/test_roadmap_3_work_unit_01.py'
      - 'tests/unit/test_roadmap_3_work_unit_02.py'
      - 'docs/ROADMAP-3-WU01-RUNTIME-CONFORMANCE-HARNESS.md'
      - 'docs/ROADMAP-3-WU02-RUNTIME-ADMISSION-GATE.md'

jobs:
  runtime-admission-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU02 runtime admission evidence
        run: python tests/unit/test_roadmap_3_work_unit_02.py
      - name: WU01 conformance regression
        run: python tests/unit/test_roadmap_3_work_unit_01.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral admission boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai|sklearn|torch)' src/metao/runtime_admission.py src/metao/runtime_conformance.py
      - name: Factory independence
        run: |
          ! grep -E '^(from|import) .*runtime_factory' src/metao/runtime_admission.py
