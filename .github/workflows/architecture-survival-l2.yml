name: Architecture Survival L2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/architecture-survival-l2.yml'
      - 'scripts/run_architecture_survival_l2.py'
      - 'experiments/rust-chassis-a/metao-contracts/**'
      - 'experiments/rust-chassis-a/metao-kernel/**'
      - 'experiments/rust-chassis-a/metao-testkit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-main-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record toolchain
        run: |
          python --version
          rustc --version
          cargo --version
      - name: Execute current-contract L2 fixtures
        run: |
          python scripts/run_architecture_survival_l2.py \
            --output .artifacts/architecture-survival-l2.json
      - name: Upload L2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architecture-survival-l2-${{ github.run_id }}
          if-no-files-found: error
          path: .artifacts/architecture-survival-l2.json
