name: Temporary fix 499
on:
  push:
    branches: [feat/runtime-health-trusted-admission-482]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix empty runtime-health test fixture and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          perl -0pi -e 's/(value\.window_end_sequence = 11;\n)(\s*let result = derive_runtime_health\(&value)/$1    value.evidence_basis = RuntimeHealthEvidenceBasis::Unknown;\n$2/' metao-contracts/tests/runtime_health_tests.rs
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: align empty runtime-health test evidence'
            git push
          fi