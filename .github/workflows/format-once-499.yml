name: Temporary fix 499
on:
  push:
    branches: [feat/runtime-health-trusted-admission-482]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix empty health fixture and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          perl -0pi -e 's/evidence_basis: RuntimeHealthEvidenceBasis::IndependentObservation,/evidence_basis: if self.health_attempts == 0 { RuntimeHealthEvidenceBasis::Unknown } else { RuntimeHealthEvidenceBasis::IndependentObservation },/' metao-contracts/tests/control_plane_stateful_property_tests.rs
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: mark empty stateful health windows unknown'
            git push
          fi