name: Temporary fix 499
on:
  push:
    branches: [feat/runtime-health-trusted-admission-482]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply remaining lint fixes and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          perl -0pi -e 's/\.map_or\(true, \|v\| now <= v\)/.is_none_or(|v| now <= v)/g' metao-contracts/src/execution_governance.rs
          perl -0pi -e 's/\.attempts_used\s*\.checked_add\(snapshot\.reserved\.attempts\)\s*\.unwrap_or\(u64::MAX\)/.attempts_used.saturating_add(snapshot.reserved.attempts)/g' metao-contracts/src/runtime_health.rs
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: complete Rust qualification lint cleanup'
            git push
          fi