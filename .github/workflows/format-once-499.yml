name: Temporary fix 499
on:
  push:
    branches: [feat/runtime-health-trusted-admission-482]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix authority-boundary wording and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          matches=$(rg -l 'dispatch remains separate authority' . || true)
          if [ -n "$matches" ]; then
            perl -pi -e 's/dispatch remains separate authority/execution remains separate authority/g' $matches
          fi
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: clarify recovery authority boundary wording'
            git push
          fi