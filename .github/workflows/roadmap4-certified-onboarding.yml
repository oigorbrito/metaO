name: Roadmap 4 Certified Runtime Onboarding

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap4-certified-onboarding.yml'
      - 'src/metao/runtime_factory.py'
      - 'src/metao/runtime_feedback.py'
      - 'src/metao/sqlite_runtime_feedback.py'
      - 'src/metao/feedback_catalog.py'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_certification.py'
      - 'src/metao/sqlite_runtime_certification.py'
      - 'tests/unit/test_roadmap_4_work_unit_01.py'
      - 'tests/unit/test_roadmap_3_work_unit_0*.py'
      - 'docs/ROADMAP-4-WU01-DECLARATIVE-CERTIFIED-ONBOARDING.md'
  workflow_dispatch:

jobs:
  certified-runtime-onboarding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e ".[test]"
      - name: Roadmap 4 WU01 focused evidence
        run: python -m unittest tests.unit.test_roadmap_4_work_unit_01 -v
      - name: Roadmap 3 certification regression
        run: |
          python -m unittest tests.unit.test_roadmap_3_work_unit_01 -v
          python -m unittest tests.unit.test_roadmap_3_work_unit_02 -v
          python -m unittest tests.unit.test_roadmap_3_work_unit_03 -v
      - name: Full unit regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral control plane
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
