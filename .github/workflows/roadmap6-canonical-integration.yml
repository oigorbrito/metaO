name: Roadmap 6 Canonical Integration Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap6-canonical-integration.yml'
      - 'src/metao/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'docs/ROADMAP-2-WU05-DETERMINISTIC-RUNTIME-FEEDBACK.md'
      - 'docs/ROADMAP-2-CLOSEOUT.md'
      - 'docs/ROADMAP-3-*.md'
      - 'docs/ROADMAP-4-*.md'
      - 'docs/ROADMAP-5-*.md'
      - 'docs/ROADMAP-6-*.md'
      - 'docs/RELEASE-READINESS.md'
  workflow_dispatch:

jobs:
  canonical-integration:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm pinned runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
      - name: Installed CLI smoke
        run: |
          metao --help
          python -c "import metao; import metao.runtime_factory; import metao.runtime_certification; import metao.runtime_certification_revocation"
      - name: Roadmap 2 WU05 deterministic feedback focused regression
        run: python -m unittest tests.unit.test_roadmap_2_work_unit_05 -v
      - name: Full unit suite
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Roadmap 2 real runtime sandbox
        run: python tests/integration/test_r2_wu01_second_real_runtime.py
      - name: Roadmap 3 real runtime certification
        run: python tests/integration/test_r3_wu04_real_runtime_certification.py
      - name: Roadmap 4 real declarative certified runtimes
        run: python tests/integration/test_r4_wu03_real_declarative_certified_runtimes.py
      - name: Roadmap 5 real certificate lifecycle
        run: python tests/integration/test_r5_wu04_real_certificate_lifecycle.py
      - name: Block O cumulative sandbox regression
        run: |
          python tests/integration/test_o1_langgraph_real.py
          python tests/integration/test_o2_e2e_sandbox.py
          python tests/integration/test_o3_failover_sandbox.py
          python tests/integration/test_o4_governance_gates.py
          python tests/integration/test_o5_runtime_swap.py
      - name: Enforce SDK-neutral metaO boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
