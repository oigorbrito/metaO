name: Roadmap 6 Canonical Integration Candidate

# Canonical owner of credential-free real runtime smoke evidence.
on:
  pull_request:
    paths:
      - '.github/workflows/roadmap6-canonical-integration.yml'
      - 'scripts/codex_app_server_real_binary_smoke.py'
      - 'scripts/deepseek_live_auth_smoke.py'
      - 'scripts/gemini_live_auth_smoke.py'
      - 'src/metao/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'docs/ROADMAP-2-WU05-DETERMINISTIC-RUNTIME-FEEDBACK.md'
      - 'docs/ROADMAP-2-CLOSEOUT.md'
      - 'docs/ROADMAP-3-*.md'
      - 'docs/ROADMAP-4-*.md'
      - 'docs/ROADMAP-5-*.md'
      - 'docs/ROADMAP-6-*.md'
      - 'docs/ROADMAP-7-*.md'
      - 'docs/RELEASE-READINESS.md'
  workflow_dispatch:

jobs:
  canonical-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'openai-agents==0.20.0' 'langgraph==1.2.11' 'crewai==1.15.16'
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/codex-home"
          npm install -g '@openai/codex@0.153.3'
      - name: Confirm pinned runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('openai-agents') == '0.20.0'; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('OpenAI Agents', version('openai-agents')); print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
          VERSION_OUTPUT="$(codex --version)"
          echo "$VERSION_OUTPUT"
          case "$VERSION_OUTPUT" in
            *"0.153.3"*) ;;
            *) echo "expected Codex CLI 0.153.3" >&2; exit 1 ;;
          esac
      - name: Installed CLI smoke
        run: |
          metao --help
          python -c "import metao; import metao.runtime_factory; import metao.runtime_certification; import metao.runtime_certification_revocation"
      - name: Real Codex App Server binary smoke
        run: python scripts/codex_app_server_real_binary_smoke.py | tee "$RUNNER_TEMP/codex-app-server-smoke.json"
      - name: Validate Codex evidence boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'codex-app-server-smoke.json'
          lines = [line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert lines
          evidence = json.loads(lines[-1])
          assert evidence['initialize'] == 'PASS'
          assert evidence['thread_start'] == 'PASS'
          assert evidence['thread_ephemeral'] is True
          assert evidence['thread_id_present'] is True
          assert evidence['provider_turn_started'] is False
          assert evidence['provider_backed_execution'] == 'NOT_TESTED'
          assert evidence['openai_api_key_present'] is False
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
      - name: DeepSeek live authentication smoke
        run: python scripts/deepseek_live_auth_smoke.py | tee "$RUNNER_TEMP/deepseek-live-auth-smoke.json"
      - name: Validate DeepSeek live evidence boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'deepseek-live-auth-smoke.json'
          lines = [line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert lines
          evidence = json.loads(lines[-1])
          assert evidence['base_url'] == 'https://api.deepseek.com'
          assert evidence['endpoint'] == '/chat/completions'
          assert evidence['execution_status'] == 'FAILED'
          assert evidence['observed_http_status'] == 401
          assert evidence['capacity_status'] == 'authentication_failure'
          assert evidence['recovery'] is None
          assert evidence['synthetic_invalid_credential'] is True
          assert evidence['paid_inference_authorized'] is False
          assert evidence['provider_backed_execution'] == 'NOT_TESTED'
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
      - name: Gemini live authentication diagnostic
        run: python scripts/gemini_live_auth_smoke.py | tee "$RUNNER_TEMP/gemini-live-auth-smoke.json"
      - name: Validate Gemini list-envelope diagnostic boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'gemini-live-auth-smoke.json'
          lines = [line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert lines, 'Gemini diagnostic produced no evidence output'
          evidence = json.loads(lines[-1])
          assert evidence['base_url'] == 'https://generativelanguage.googleapis.com/v1beta'
          assert evidence['endpoint'] == '/interactions'
          assert evidence['observed_http_status'] == 400
          assert evidence['credential_value_emitted'] is False
          assert evidence['capacity_classification'] == 'NOT_YET_QUALIFIED'
          assert evidence['synthetic_invalid_credential'] is True
          assert evidence['paid_inference_authorized'] is False
          assert evidence['provider_backed_execution'] == 'NOT_TESTED'
          assert evidence['body_kind'] == 'list'
          assert isinstance(evidence['body_list_length'], int)
          assert evidence['body_list_length'] >= 1
          assert isinstance(evidence['body_list_items'], list)
          assert evidence['body_list_items'], evidence
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
      - name: Roadmap 2 WU05 deterministic feedback focused regression
        run: python -m unittest tests.unit.test_roadmap_2_work_unit_05 -v
      - name: Roadmap 7 focused replanning regressions
        run: |
          python tests/unit/test_roadmap_7_work_unit_01.py
          python tests/unit/test_roadmap_7_work_unit_02.py
      - name: Full unit suite
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Roadmaps 2-5 real runtime regressions
        run: |
          python tests/integration/test_r2_wu01_second_real_runtime.py
          python tests/integration/test_r3_wu04_real_runtime_certification.py
          python tests/integration/test_r4_wu03_real_declarative_certified_runtimes.py
          python tests/integration/test_r5_wu04_real_certificate_lifecycle.py
      - name: Roadmap 6 OpenAI and three-runtime regressions
        run: |
          python tests/integration/test_r6_wu04_openai_agents_real.py
          python tests/integration/test_r6_wu05_three_real_runtimes.py
      - name: Roadmap 7 three-runtime recovery
        run: python tests/integration/test_r7_wu03_three_runtime_recovery.py
      - name: Block O cumulative sandbox regression
        run: |
          python tests/integration/test_o1_langgraph_real.py
          python tests/integration/test_o2_e2e_sandbox.py
          python tests/integration/test_o3_failover_sandbox.py
          python tests/integration/test_o4_governance_gates.py
          python tests/integration/test_o5_runtime_swap.py
      - name: Enforce SDK-neutral metaO boundary
        run: |
          ! grep -R -E '^[[:space:]]*(from|import)[[:space:]]+(langgraph|crewai|agents|openai)([[:space:].]|$)' src/metao --exclude-dir=adapters
