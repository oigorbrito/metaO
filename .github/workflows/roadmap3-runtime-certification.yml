name: Roadmap 3 Durable Runtime Certification

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap3-runtime-certification.yml'
      - 'src/metao/runtime_certification.py'
      - 'src/metao/sqlite_runtime_certification.py'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_conformance.py'
      - 'tests/unit/test_roadmap_3_work_unit_01.py'
      - 'tests/unit/test_roadmap_3_work_unit_02.py'
      - 'tests/unit/test_roadmap_3_work_unit_03.py'
      - 'docs/ROADMAP-3-WU03-DURABLE-RUNTIME-CERTIFICATION.md'

jobs:
  durable-runtime-certification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU03 durable certification evidence
        run: python tests/unit/test_roadmap_3_work_unit_03.py
      - name: WU02 admission regression
        run: python tests/unit/test_roadmap_3_work_unit_02.py
      - name: WU01 conformance regression
        run: python tests/unit/test_roadmap_3_work_unit_01.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral certification boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai|sklearn|torch)' src/metao/runtime_certification.py src/metao/sqlite_runtime_certification.py src/metao/runtime_admission.py
      - name: Factory independence
        run: |
          ! grep -E '^(from|import) .*runtime_factory' src/metao/runtime_certification.py src/metao/sqlite_runtime_certification.py src/metao/runtime_admission.py
