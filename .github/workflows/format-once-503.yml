name: Temporary format 503
on:
  push:
    branches:
      - feat/runtime-health-constituent-provenance-501
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Fix mechanical Clippy findings
        working-directory: experiments/rust-chassis-a
        shell: bash
        run: |
          perl -0pi -e 's/\.map_or\(true, \|v\| now >= v\)/.is_none_or(|v| now >= v)/g; s/\.map_or\(true, \|v\| now <= v\)/.is_none_or(|v| now <= v)/g' metao-contracts/src/execution_governance.rs
          perl -0pi -e 's/\.checked_add\(snapshot\.reserved\.tokens\)\s*\.unwrap_or\(u64::MAX\)/.saturating_add(snapshot.reserved.tokens)/g; s/\.checked_add\(snapshot\.reserved\.attempts\)\s*\.unwrap_or\(u64::MAX\)/.saturating_add(snapshot.reserved.attempts)/g' metao-contracts/src/runtime_health.rs
          perl -0pi -e 's/^pub fn project_retry_governance/#[allow(clippy::too_many_arguments)]\npub fn project_retry_governance/m' metao-contracts/src/execution_governance.rs
          perl -0pi -e 's/^pub fn project_recovery_probe_governance/#[allow(clippy::too_many_arguments)]\npub fn project_recovery_probe_governance/m' metao-contracts/src/runtime_health.rs
          sed -i 's/let fencing_token = lease_generation\.saturating_add/let fencing_token: u64 = lease_generation.saturating_add/' metao-contracts/tests/runtime_health_constituent_durable_reopen_tests.rs
      - name: Format
        working-directory: experiments/rust-chassis-a
        run: cargo fmt --all
      - name: Clippy verification
        working-directory: experiments/rust-chassis-a
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rust-chassis-a
          if git diff --cached --quiet; then
            echo "already-clean"
          else
            git commit -m "fix: satisfy Rust qualification lints"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
