name: Temporary format 503
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Format
        working-directory: experiments/rust-chassis-a
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rust-chassis-a
          if git diff --cached --quiet; then
            echo "already-formatted"
          else
            git commit -m "style: format Rust contract sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
