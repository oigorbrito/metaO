name: Actions Runner Diagnostic

on:
  push:
    branches:
      - ops/actions-runner-diagnostic-v1
  pull_request:
    branches:
      - roadmap7/wu04-closeout-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner allocated
        run: |
          echo "runner-ok"
          uname -a
