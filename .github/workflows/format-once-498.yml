name: Temporary fix 498
on:
  workflow_dispatch:
  push:
    branches: [feat/runtime-health-result-lineage-481]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply idempotent lint fixes and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          perl -0pi -e 's/\.map_or\(true, \|v\| now >= v\)/.is_none_or(|v| now >= v)/g; s/\.map_or\(true, \|v\| now <= v\)/.is_none_or(|v| now <= v)/g' metao-contracts/src/execution_governance.rs
          perl -0pi -e 's/(\n)(pub fn project_retry_governance)/$1#[allow(clippy::too_many_arguments)]\n$2/g; s/(\n)(pub fn project_recovery_probe_governance)/$1#[allow(clippy::too_many_arguments)]\n$2/g' metao-contracts/src/execution_governance.rs metao-contracts/src/runtime_health.rs
          perl -0pi -e 's/\.tokens_used\s*\.checked_add\(snapshot\.reserved\.tokens\)\s*\.unwrap_or\(u64::MAX\)/.tokens_used.saturating_add(snapshot.reserved.tokens)/g; s/\.attempts_used\s*\.checked_add\(snapshot\.reserved\.attempts\)\s*\.unwrap_or\(u64::MAX\)/.attempts_used.saturating_add(snapshot.reserved.attempts)/g' metao-contracts/src/runtime_health.rs
          perl -0pi -e 's/(#\[allow\(clippy::too_many_arguments\)\]\n)+/#\[allow(clippy::too_many_arguments)\]\n/g' metao-contracts/src/execution_governance.rs metao-contracts/src/runtime_health.rs
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: make Rust lint cleanup idempotent'
            git push
          fi