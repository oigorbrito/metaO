name: Temporary format 498
on:
  push:
    branches: [feat/runtime-health-result-lineage-481]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cd experiments/rust-chassis-a
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: apply canonical Rust formatting'
            git push
          fi