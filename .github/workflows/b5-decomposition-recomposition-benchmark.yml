name: B5 Decomposition Recomposition Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b5-decomposition-recomposition-benchmark.yml'
      - 'scripts/run_b5_decomposition_recomposition_benchmark.py'
      - 'src/metao/project_supervision.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b5-decomposition-recomposition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install metaO
        run: python -m pip install -e .

      - name: Run B5 benchmark
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .artifacts/b5
          python scripts/run_b5_decomposition_recomposition_benchmark.py \
            --commit "$EXACT_HEAD_SHA" \
            --output .artifacts/b5/b5-decomposition-recomposition.json

      - name: Validate B5 evidence boundary
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path('.artifacts/b5/b5-decomposition-recomposition.json').read_text()
          )
          assert evidence['commit'] == os.environ['EXACT_HEAD_SHA']
          assert evidence['result'] == 'GAP_IDENTIFIED'
          boundary = evidence['boundary']
          assert boundary['decomposition'] == 'PASS'
          assert boundary['work_unit_execution'] == 'PASS'
          assert boundary['dependency_preservation'] == 'PASS'
          assert boundary['recomposition'] == 'GAP_IDENTIFIED'
          assert boundary['original_spec_verification_after_recomposition'] == 'GAP_IDENTIFIED'

          adversarial = next(
              case for case in evidence['cases']
              if case['case_id'] == 'adversarial-global-mismatch'
          )
          assert adversarial['candidate_project_verdict'] == 'PROJECT_ACCEPTED'
          assert adversarial['all_local_units_accepted'] is True
          assert adversarial['baseline']['spec_satisfied'] is False
          PY

      - name: Upload B5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b5-decomposition-recomposition-${{ github.run_id }}
          path: .artifacts/b5/
          if-no-files-found: error
