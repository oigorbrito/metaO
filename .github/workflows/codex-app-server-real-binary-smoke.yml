name: Codex App Server Real Binary Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/codex-app-server-real-binary-smoke.yml'
      - 'scripts/codex_app_server_real_binary_smoke.py'
      - 'src/metao/adapters/codex_app_server.py'
      - 'src/metao/adapters/codex_app_server_stdio.py'
  workflow_dispatch:

jobs:
  real-codex-binary-smoke:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ''
      CODEX_HOME: ${{ runner.temp }}/codex-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install metaO
        run: python -m pip install -e .
      - name: Install pinned real Codex CLI
        run: |
          mkdir -p "$CODEX_HOME"
          npm install -g '@openai/codex@0.153.3'
      - name: Confirm exact Codex CLI version
        run: |
          VERSION_OUTPUT="$(codex --version)"
          echo "$VERSION_OUTPUT"
          case "$VERSION_OUTPUT" in
            *"0.153.3"*) ;;
            *) echo "expected Codex CLI 0.153.3" >&2; exit 1 ;;
          esac
      - name: Real App Server initialize and ephemeral thread smoke
        run: |
          python scripts/codex_app_server_real_binary_smoke.py | tee "$RUNNER_TEMP/codex-app-server-smoke.json"
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'codex-app-server-smoke.json'
          lines = [line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert lines, 'smoke produced no evidence output'
          evidence = json.loads(lines[-1])
          assert evidence['initialize'] == 'PASS'
          assert evidence['thread_start'] == 'PASS'
          assert evidence['thread_ephemeral'] is True
          assert evidence['thread_id_present'] is True
          assert evidence['provider_turn_started'] is False
          assert evidence['provider_backed_execution'] == 'NOT_TESTED'
          assert evidence['openai_api_key_present'] is False
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
