name: Roadmap 2 Declarative Runtime Catalog

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap2-runtime-catalog.yml'
      - 'src/metao/runtime_factory.py'
      - 'tests/unit/test_roadmap_2_work_unit_02.py'
      - 'docs/ROADMAP-2-WU02-DECLARATIVE-RUNTIME-CATALOG.md'

jobs:
  runtime-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU02 declarative runtime catalog evidence
        run: python tests/unit/test_roadmap_2_work_unit_02.py
      - name: Roadmap 1 full regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral factory boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai)' src/metao/runtime_factory.py
