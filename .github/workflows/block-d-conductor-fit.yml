name: Conductor Real-Path Fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/block-d-conductor-fit.yml'
      - 'tests/integration/block_d_conductor_fit.py'
      - 'tests/integration/block_f_conductor_adapter_fit.py'
      - 'src/metao/durable.py'
      - 'src/metao/adapters/conductor_http.py'
      - 'docs/FOUNDATION-FIT.md'
  pull_request:
    paths:
      - '.github/workflows/block-d-conductor-fit.yml'
      - 'tests/integration/block_d_conductor_fit.py'
      - 'tests/integration/block_f_conductor_adapter_fit.py'
      - 'src/metao/durable.py'
      - 'src/metao/adapters/conductor_http.py'
      - 'docs/FOUNDATION-FIT.md'
  workflow_dispatch:

jobs:
  conductor-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONDUCTOR_TEST_SERVER_VERSION: '3.32.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO and Conductor CLI
        run: |
          python -m pip install -e .
          npm install -g @conductor-oss/conductor-cli
      - name: Start Conductor
        run: |
          conductor server start --version "$CONDUCTOR_TEST_SERVER_VERSION"
          python - <<'PY'
          import time, urllib.request
          for _ in range(180):
              try:
                  with urllib.request.urlopen('http://localhost:8080/api/health', timeout=2) as r:
                      if r.status < 500:
                          break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Conductor did not become ready')
          PY
      - name: Block D foundation fit
        run: python tests/integration/block_d_conductor_fit.py
      - name: Block F adapter fit
        run: python tests/integration/block_f_conductor_adapter_fit.py
      - name: Show Conductor log on failure
        if: failure()
        run: conductor server logs || true
