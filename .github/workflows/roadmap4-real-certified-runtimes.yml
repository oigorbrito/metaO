name: Roadmap 4 Real Declarative Certified Runtimes

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap4-real-certified-runtimes.yml'
      - 'src/metao/**'
      - 'tests/integration/test_r4_wu03_real_declarative_certified_runtimes.py'
      - 'tests/unit/test_roadmap_4_work_unit_0*.py'
      - 'docs/ROADMAP-4-WU03-REAL-DECLARATIVE-CERTIFIED-RUNTIMES.md'
  workflow_dispatch:

jobs:
  real-declarative-certified-runtimes:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm pinned versions
        run: |
          python -c "from importlib.metadata import version; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
      - name: Roadmap 4 WU03 real declarative certification evidence
        run: python tests/integration/test_r4_wu03_real_declarative_certified_runtimes.py
      - name: Roadmap 4 unit regressions
        run: |
          python -m unittest tests.unit.test_roadmap_4_work_unit_01 -v
          python -m unittest tests.unit.test_roadmap_4_work_unit_02 -v
      - name: Roadmap 3 real runtime regression
        run: python tests/integration/test_r3_wu04_real_runtime_certification.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral metaO boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
