name: Roadmap 2 Runtime Control CLI

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap2-runtime-control-cli.yml'
      - 'src/metao/entrypoint.py'
      - 'src/metao/runtime_factory.py'
      - 'pyproject.toml'
      - 'tests/unit/test_roadmap_2_work_unit_04.py'
      - 'tests/unit/test_roadmap_1_work_unit_06.py'
      - 'docs/ROADMAP-2-WU04-RUNTIME-CONTROL-CLI.md'

jobs:
  runtime-control-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU04 runtime control CLI evidence
        run: python tests/unit/test_roadmap_2_work_unit_04.py
      - name: Installed console surface
        run: |
          metao --help
          metao --help | grep runtime-quarantine
          metao --help | grep runtime-restore
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral entrypoint boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai)' src/metao/entrypoint.py src/metao/runtime_factory.py
