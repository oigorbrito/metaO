name: Self-Hosted Runner Readiness Windows

on:
  workflow_dispatch:
    inputs:
      target_head:
        description: 'Exact 40-character Git commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: self-hosted-runner-readiness-windows
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: [self-hosted, Windows, X64, metao-project-pilot]
    timeout-minutes: 5
    steps:
      - name: Validate target SHA before checkout
        shell: pwsh
        env:
          METAO_TARGET_HEAD: ${{ inputs.target_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:METAO_TARGET_HEAD -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'target_head must be an exact 40-character Git SHA'
          }

      - name: Checkout exact target head without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_head }}
          persist-credentials: false

      - name: Evaluate fixed Windows runner readiness boundary
        shell: pwsh
        env:
          METAO_TARGET_HEAD: ${{ inputs.target_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:METAO_TARGET_HEAD.ToLowerInvariant()) {
            throw 'checked-out HEAD differs from target_head'
          }
          if (-not [Environment]::Is64BitOperatingSystem -or -not [Environment]::Is64BitProcess) {
            throw 'runner must be Windows x64'
          }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'GitHub runner metadata must report Windows/X64'
          }
          $executables = [ordered]@{}
          foreach ($name in @('git','ssh','scp','curl','tar','python')) {
            $executables[$name] = $null -ne (Get-Command $name -ErrorAction SilentlyContinue)
          }
          $missing = @($executables.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) { throw ('runner missing required executables: ' + ($missing -join ',')) }
          $py = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($LASTEXITCODE -ne 0) { throw 'python version probe failed' }
          $parts = $py.Trim().Split('.')
          if ([int]$parts[0] -lt 3 -or ([int]$parts[0] -eq 3 -and [int]$parts[1] -lt 12)) {
            throw 'runner requires Python 3.13+'
          }
          $probe = Join-Path $env:RUNNER_TEMP ('metao-readiness-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probe | Out-Null
          try {
            $file = Join-Path $probe 'probe.txt'
            Set-Content -LiteralPath $file -Value 'ok' -NoNewline
            if ((Get-Content -LiteralPath $file -Raw) -ne 'ok') { throw 'runner temporary storage is not writable' }
          } finally {
            Remove-Item -Recurse -Force -LiteralPath $probe
          }
          [ordered]@{
            bootstrap_readiness='PASS'; target_head=$env:METAO_TARGET_HEAD.ToLowerInvariant();
            checked_out_head_matches=$true; windows=$true; x64=$true; python_3_13_plus=$true;
            required_executables=$executables;
            required_labels=@('self-hosted','Windows','X64','metao-project-pilot');
            repository_secrets_checked=$false; provider_calls_made=$false; credentials_emitted=$false;
            host_values_emitted=$false; target_code_executed=$false; pilot_operational_pass=$false
          } | ConvertTo-Json -Compress
