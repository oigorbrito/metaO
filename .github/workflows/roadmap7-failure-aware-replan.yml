name: Roadmap 7 Failure-Aware Replan Authority

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap7-failure-aware-replan.yml'
      - 'src/metao/control_plane.py'
      - 'src/metao/replan.py'
      - 'tests/unit/test_roadmap_7_work_unit_01.py'
      - 'tests/unit/test_block_i_replan_failover.py'
      - 'docs/ROADMAP-7-WU01-FAILURE-AWARE-REPLAN-AUTHORITY.md'

jobs:
  failure-aware-replan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Roadmap 7 WU01 focused regression
        run: python tests/unit/test_roadmap_7_work_unit_01.py
      - name: Existing replan primitive regression
        run: python tests/unit/test_block_i_replan_failover.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Preserve runtime SDK boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai|agents|openai)' src/metao --exclude-dir=adapters
