name: Diagnostic Observed Performance Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-observed-performance.yml'
      - 'src/metao/observed_performance.py'
      - 'src/metao/observed_performance_store.py'
      - 'tests/unit/test_observed_performance_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run focused test
        id: focused
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests/unit -p 'test_observed_performance_evidence.py' -v > diagnostic.txt 2>&1
          status=$?
          printf '\nEXIT_CODE=%s\n' "$status" >> diagnostic.txt
          exit "$status"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observed-performance-diagnostic
          if-no-files-found: error
          path: diagnostic.txt
