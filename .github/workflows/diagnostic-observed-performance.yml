name: Diagnostic Observed Performance Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-observed-performance.yml'
      - 'src/metao/observed_performance.py'
      - 'src/metao/observed_performance_store.py'
      - 'tests/unit/test_observed_performance_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner marker
        shell: bash
        run: |
          python --version > diagnostic.txt 2>&1
          printf 'RUNNER_STARTED=1\n' >> diagnostic.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Direct source import
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -c 'import metao.observed_performance; import metao.observed_performance_store' >> diagnostic.txt 2>&1
          status=$?
          printf 'IMPORT_EXIT_CODE=%s\n' "$status" >> diagnostic.txt
          exit "$status"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observed-performance-diagnostic
          if-no-files-found: error
          path: diagnostic.txt
