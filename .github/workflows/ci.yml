name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, metao-project-pilot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate immutable GitHub Action pins
        run: python scripts/validate_github_action_pins.py
      - name: Install Python package
        run: python -m pip install -e .
      - name: Unit and architecture tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Install web dependencies
        run: npm install --ignore-scripts
      - name: TypeScript validation
        run: npm run lint
      - name: Web security headers
        run: npm run test:web-security
      - name: Web production build
        run: npm run build
