name: CI

on:
  push:
    branches: [main, research/wave2-capacity-evidence-ci-harness]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Unit and architecture tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
