name: Roadmap 5 Certification Lifecycle CLI

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap5-certification-lifecycle-cli.yml'
      - 'src/metao/entrypoint.py'
      - 'tests/unit/test_roadmap_5_work_unit_03.py'
      - 'docs/ROADMAP-5-WU03-CERTIFICATION-LIFECYCLE-CLI.md'
  workflow_dispatch:

jobs:
  certification-lifecycle-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Roadmap 5 WU03 focused tests
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_03 -v
      - name: Roadmap 5 WU02 revocation regression
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_02 -v
      - name: Roadmap 5 WU01 freshness regression
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_01 -v
      - name: Roadmap 2 runtime-control CLI regression
        run: python -m unittest tests.unit.test_roadmap_2_work_unit_04 -v
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral entrypoint
        run: |
          ! grep -E '^(from|import) (langgraph|crewai)' src/metao/entrypoint.py
