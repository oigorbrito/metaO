name: Roadmap 6 Three Runtime Regression

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap6-three-runtime-regression.yml'
      - 'src/metao/adapters/**'
      - 'src/metao/runtime_factory.py'
      - 'src/metao/runtime_conformance.py'
      - 'src/metao/runtime_control.py'
      - 'src/metao/runtime_certification.py'
      - 'src/metao/runtime_certification_revocation.py'
      - 'tests/integration/_openai_agents_model.py'
      - 'tests/integration/test_r6_wu05_three_real_runtimes.py'
      - 'tests/integration/test_r6_wu04_openai_agents_real.py'
      - 'tests/integration/test_r5_wu04_real_certificate_lifecycle.py'
      - 'docs/ROADMAP-6-WU05-THREE-RUNTIME-DECLARATIVE-REGRESSION.md'

jobs:
  three-runtime-regression:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ''
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and three pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install 'openai-agents==0.20.0' 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm pinned runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('openai-agents') == '0.20.0'; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('OpenAI Agents', version('openai-agents')); print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
      - name: WU05 three real runtime evidence
        run: python tests/integration/test_r6_wu05_three_real_runtimes.py
      - name: WU04 third runtime conformance regression
        run: python tests/integration/test_r6_wu04_openai_agents_real.py
      - name: Existing two-runtime lifecycle regression
        run: python tests/integration/test_r5_wu04_real_certificate_lifecycle.py
      - name: Existing real declarative runtime regression
        run: python tests/integration/test_r4_wu03_real_declarative_certified_runtimes.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral production boundary
        run: |
          ! grep -R -E '^[[:space:]]*(from|import)[[:space:]]+(agents|openai)([[:space:].]|$)' src/metao
          ! grep -R -E '^[[:space:]]*(from|import)[[:space:]]+(langgraph|crewai)([[:space:].]|$)' src/metao --exclude-dir=adapters
