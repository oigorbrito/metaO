name: Operator Initialization E2E

on:
  pull_request:
    paths:
      - '.github/workflows/operator-initialization-e2e.yml'
      - 'README.md'
      - 'examples/runtime-catalog-quickstart.json'
      - 'examples/mission-quickstart-accepted.json'
      - 'src/metao/**'
      - 'tests/integration/test_operator_initialization_e2e.py'
      - 'tests/integration/test_readme_quickstart_e2e.py'
  workflow_dispatch:

jobs:
  initialization-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ''
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and real bootstrap runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11'
      - name: Verify installed CLI
        run: |
          command -v metao
          metao --help
      - name: Bootstrap to accepted mission E2E
        run: python tests/integration/test_operator_initialization_e2e.py
      - name: README clean-room quickstart E2E
        run: python tests/integration/test_readme_quickstart_e2e.py
