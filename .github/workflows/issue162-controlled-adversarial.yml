name: Issue 162 Controlled Adversarial Real Runtimes

on:
  pull_request:
    paths:
      - '.github/workflows/issue162-controlled-adversarial.yml'
      - 'scripts/run_issue_162_controlled_adversarial.py'
      - 'src/metao/**'
      - 'tests/integration/test_r2_wu01_second_real_runtime.py'
      - 'docs/ADVERSARIAL-CERTIFICATION-DONORS.md'
      - 'docs/adversarial-certification-donors.json'
  workflow_dispatch:

jobs:
  controlled-adversarial:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm exact runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'"
      - name: Run controlled adversarial campaign
        run: |
          mkdir -p .artifacts
          python scripts/run_issue_162_controlled_adversarial.py --output .artifacts/issue-162-controlled-adversarial.json
      - name: Validate machine-readable evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.artifacts/issue-162-controlled-adversarial.json').read_text())
          assert data['classification'] == 'REAL_RUNTIME_CONTROLLED_ADVERSARIAL'
          assert data['agentdojo_executed'] is False
          assert data['pyrit_executed'] is False
          assert data['external_model_provider_executed'] is False
          assert data['universal_safety_claim_authorized'] is False
          assert {item['binding']['runtime_id'] for item in data['reports']} == {'langgraph-real', 'crewai-real'}
          assert all(item['decision'] == 'Certified' for item in data['reports'])
          assert all(item['decision'] == 'NotCertified' for item in data['negative_controls'])
          print('issue-162 controlled adversarial evidence: PASS')
          PY
      - name: Full real-runtime regression
        run: python tests/integration/test_r2_wu01_second_real_runtime.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral metaO boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
      - name: Upload controlled adversarial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-162-controlled-adversarial-${{ github.run_id }}
          path: .artifacts/issue-162-controlled-adversarial.json
          if-no-files-found: error
