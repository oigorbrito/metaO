name: Roadmap 5 Certificate Freshness

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap5-certificate-freshness.yml'
      - 'src/metao/runtime_certification.py'
      - 'src/metao/sqlite_runtime_certification.py'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_factory.py'
      - 'tests/unit/test_roadmap_5_work_unit_01.py'
      - 'docs/ROADMAP-5-WU01-CERTIFICATE-FRESHNESS.md'
  workflow_dispatch:

jobs:
  certificate-freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Roadmap 5 WU01 focused tests
        run: python -m unittest tests.unit.test_roadmap_5_work_unit_01 -v
      - name: Roadmap 4 certificate reuse regression
        run: python -m unittest tests.unit.test_roadmap_4_work_unit_02 -v
      - name: Roadmap 3 certification regression
        run: python -m unittest tests.unit.test_roadmap_3_work_unit_03 -v
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral control-plane boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
