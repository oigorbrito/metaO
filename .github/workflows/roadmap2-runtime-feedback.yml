name: Roadmap 2 Deterministic Runtime Feedback

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap2-runtime-feedback.yml'
      - 'src/metao/runtime_feedback.py'
      - 'src/metao/sqlite_runtime_feedback.py'
      - 'src/metao/feedback_catalog.py'
      - 'src/metao/runtime_factory.py'
      - 'tests/unit/test_roadmap_2_work_unit_05.py'
      - 'docs/ROADMAP-2-WU05-DETERMINISTIC-RUNTIME-FEEDBACK.md'

jobs:
  deterministic-runtime-feedback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: WU05 deterministic feedback evidence
        run: python tests/unit/test_roadmap_2_work_unit_05.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: SDK-neutral non-ML feedback boundary
        run: |
          ! grep -E '^(from|import) (langgraph|crewai|sklearn|torch)' src/metao/runtime_feedback.py src/metao/sqlite_runtime_feedback.py src/metao/feedback_catalog.py src/metao/runtime_factory.py
