name: Roadmap 3 Real Runtime Certification

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap3-real-runtime-certification.yml'
      - 'src/metao/runtime_conformance.py'
      - 'src/metao/runtime_admission.py'
      - 'src/metao/runtime_certification.py'
      - 'src/metao/sqlite_runtime_certification.py'
      - 'src/metao/adapters/**'
      - 'tests/integration/test_r3_wu04_real_runtime_certification.py'
      - 'tests/integration/test_r2_wu01_second_real_runtime.py'
      - 'tests/unit/test_roadmap_3_work_unit_01.py'
      - 'tests/unit/test_roadmap_3_work_unit_02.py'
      - 'tests/unit/test_roadmap_3_work_unit_03.py'
      - 'docs/ROADMAP-3-WU04-REAL-RUNTIME-CERTIFICATION.md'

jobs:
  real-runtime-certification:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm pinned runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
      - name: WU04 real runtime certification evidence
        run: python tests/integration/test_r3_wu04_real_runtime_certification.py
      - name: Roadmap 2 real runtime regression
        run: python tests/integration/test_r2_wu01_second_real_runtime.py
      - name: Roadmap 3 unit regressions
        run: |
          python tests/unit/test_roadmap_3_work_unit_01.py
          python tests/unit/test_roadmap_3_work_unit_02.py
          python tests/unit/test_roadmap_3_work_unit_03.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Enforce SDK-neutral Roadmap 3 boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai)' src/metao --exclude-dir=adapters
