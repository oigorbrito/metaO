name: Roadmap 7 Durable Replan Escalation

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap7-durable-replan-escalation.yml'
      - 'src/metao/operator.py'
      - 'src/metao/control_plane.py'
      - 'src/metao/mission_store.py'
      - 'src/metao/sqlite_store.py'
      - 'tests/unit/test_roadmap_7_work_unit_01.py'
      - 'tests/unit/test_roadmap_7_work_unit_02.py'
      - 'tests/unit/test_roadmap_1_work_unit_05.py'
      - 'docs/ROADMAP-7-WU02-DURABLE-REPLAN-ESCALATION.md'

jobs:
  durable-replan-escalation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Roadmap 7 WU02 focused regression
        run: python tests/unit/test_roadmap_7_work_unit_02.py
      - name: Roadmap 7 WU01 regression
        run: python tests/unit/test_roadmap_7_work_unit_01.py
      - name: Existing durable approval regression
        run: python tests/unit/test_roadmap_1_work_unit_05.py
      - name: Full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Preserve runtime SDK boundary
        run: |
          ! grep -R -E '^(from|import) (langgraph|crewai|agents|openai)' src/metao --exclude-dir=adapters
