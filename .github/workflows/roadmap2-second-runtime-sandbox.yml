name: Roadmap 2 Second Real Runtime Sandbox

on:
  pull_request:
    paths:
      - '.github/workflows/roadmap2-second-runtime-sandbox.yml'
      - 'src/metao/**'
      - 'tests/integration/test_r2_wu01_second_real_runtime.py'
      - 'docs/ROADMAP-2-WU01-SECOND-REAL-RUNTIME.md'
  workflow_dispatch:

jobs:
  second-real-runtime:
    runs-on: ubuntu-24.04
    env:
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and pinned real runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11' 'crewai==1.15.16'
      - name: Confirm pinned runtime versions
        run: |
          python -c "from importlib.metadata import version; assert version('langgraph') == '1.2.11'; assert version('crewai') == '1.15.16'; print('LangGraph', version('langgraph')); print('CrewAI', version('crewai'))"
      - name: Enforce second-runtime Core freeze
        run: |
          git diff --exit-code origin/main...HEAD -- src/metao ':(exclude)src/metao/adapters/**'
      - name: Roadmap 2 WU01 second real runtime evidence
        run: python tests/integration/test_r2_wu01_second_real_runtime.py
      - name: Roadmap 1 full unit suite regression
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Block O sandbox regression
        run: |
          python tests/integration/test_o1_langgraph_real.py
          python tests/integration/test_o2_e2e_sandbox.py
          python tests/integration/test_o3_failover_sandbox.py
          python tests/integration/test_o4_governance_gates.py
          python tests/integration/test_o5_runtime_swap.py
