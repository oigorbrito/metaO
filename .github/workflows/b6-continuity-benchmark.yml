name: B6 Continuity Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b6-continuity-benchmark.yml'
      - 'scripts/run_mechanical_project_supervision_pilot.py'
      - 'src/metao/**'
      - 'tests/unit/test_roadmap_1_work_unit_05.py'
      - 'tests/unit/test_roadmap_1_work_unit_07.py'
      - 'tests/unit/test_roadmap_1_work_unit_08.py'
      - 'tests/integration/test_r7_wu03_three_runtime_recovery.py'
      - 'tests/integration/test_issue_523_project_supervision_trusted_git_bridge.py'
      - 'tests/integration/test_issue_528_project_corrective_replan.py'
      - 'tests/integration/test_issue_538_project_remote_checkpoint_supervision.py'
      - 'tests/unit/test_issue_753_project_supervision_state.py'
      - 'tests/unit/test_issue_754_project_effect_reconciliation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b6-continuity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install metaO
        run: python -m pip install -e .

      - name: Run mechanical project continuity baseline
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .artifacts/b6
          python scripts/run_mechanical_project_supervision_pilot.py \
            --commit "$EXACT_HEAD_SHA" \
            --output .artifacts/b6/mechanical-project-supervision.json

      - name: Run durable mission restart and resume gates
        run: |
          python -m unittest -v \
            tests.unit.test_roadmap_1_work_unit_05.HumanApprovalResumeV1Tests.test_sqlite_restart_between_wait_approve_and_resume \
            tests.unit.test_roadmap_1_work_unit_07.ObservabilityEventLedgerV1Tests.test_wait_approve_resume_trace_is_monotonic_across_sqlite_restarts \
            tests.unit.test_roadmap_1_work_unit_08.CliObservabilitySurfaceV1Tests.test_wait_approve_resume_events_span_cli_invocations_with_timestamps

      - name: Run Project Plane process-crash and duplicate-effect gates
        run: |
          python -m unittest -v \
            tests.unit.test_issue_753_project_supervision_state.Issue753ProjectResumeAcrossCrashTests.test_process_b_resumes_only_pending_work_after_process_a_crash \
            tests.unit.test_issue_753_project_supervision_state.Issue753ProjectSupervisionStateTests.test_real_process_takeover_increments_fence_and_stale_owner_is_rejected \
            tests.unit.test_issue_753_project_supervision_state.Issue753ProjectSupervisionStateTests.test_stale_owner_is_rejected_before_runner_dispatch \
            tests.unit.test_issue_754_project_effect_reconciliation.Issue754DuplicateEffectCrashWindowTests.test_applied_effect_is_reconciled_after_crash_without_second_application \
            tests.unit.test_issue_754_project_effect_reconciliation.Issue754ProjectEffectContractTests.test_ambiguous_effect_fails_closed_without_reissue

      - name: Install pinned heterogeneous runtimes
        run: |
          python -m pip install \
            'openai-agents==0.20.0' \
            'crewai==1.15.16' \
            'langgraph==1.2.11'
          python -c "from importlib.metadata import version; assert version('openai-agents') == '0.20.0'; assert version('crewai') == '1.15.16'; assert version('langgraph') == '1.2.11'"

      - name: Run heterogeneous runtime restart gate
        env:
          PYTHONPATH: tests/integration
        run: |
          python -m unittest -v \
            tests.integration.test_r7_wu03_three_runtime_recovery.ThreeRuntimeRecoveryV1Tests.test_04_sqlite_restart_reuses_certificates_and_preserves_real_runtime_lineage

      - name: Validate B6 evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('.artifacts/b6/mechanical-project-supervision.json').read_text())
          expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          assert evidence['commit'] == expected
          assert evidence['result'] == 'PASS'

          claims = evidence['claims']
          assert claims['trusted_repository_handoff'] == 'EXECUTED'
          assert claims['remote_checkpoint_semantics'] == 'EXECUTED'
          assert claims['mechanical_operational_proof'] == 'EXECUTED'

          boundary = {
              'mechanical_project_handoff': 'PASS',
              'durable_mission_restart_resume': 'PASS',
              'heterogeneous_runtime_restart_lineage': 'PASS',
              'project_process_crash_resume': 'PASS',
              'duplicate_effect_crash_window': 'PASS',
              'cross_provider_external_handoff': claims['cross_provider_external_handoff'],
          }

          payload = {
              'schema': 'metao-b6-continuity-v1',
              'commit': evidence['commit'],
              'result': (
                  'PASS'
                  if claims['cross_provider_external_handoff'] == 'EXECUTED'
                  else 'NOT_PROVEN'
              ),
              'boundary': boundary,
          }
          Path('.artifacts/b6/b6-continuity.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload B6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b6-continuity-${{ github.run_id }}
          path: .artifacts/b6/
          if-no-files-found: error
