name: Gemini Gemma 4 Manual Provider Success Smoke

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type I_AUTHORIZE_GEMINI_GEMMA4_ZERO_COST_SUCCESS_SMOKE exactly'
        required: true
        type: string

jobs:
  gemini-provider-success:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO
        run: python -m pip install -e .
      - name: Run explicitly authorized Gemini Gemma 4 success smoke
        env:
          METAO_LIVE_PROVIDER_SUCCESS_AUTHORIZATION: ${{ inputs.authorization }}
          METAO_GEMINI_API_KEY: ${{ secrets.METAO_GEMINI_API_KEY }}
        run: |
          python scripts/gemini_live_success_smoke.py > "$RUNNER_TEMP/gemini-live-success-smoke.json"
          cat "$RUNNER_TEMP/gemini-live-success-smoke.json"
      - name: Validate provider-success evidence boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'gemini-live-success-smoke.json'
          lines = [line for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert lines, 'Gemini live-success smoke produced no evidence output'
          evidence = json.loads(lines[-1])
          assert evidence['adapter'] == 'gemini-interactions'
          assert evidence['adapter_version'] == 'v1'
          assert evidence['base_url'] == 'https://generativelanguage.googleapis.com/v1'
          assert evidence['endpoint'] == '/interactions'
          assert evidence['target'] == 'gemma-4-26b-a4b-it'
          assert evidence['target_kind'] == 'model'
          assert evidence['execution_status'] == 'SUCCEEDED'
          assert evidence['interaction_status'] == 'completed'
          assert evidence['interaction_id_present'] is True
          assert evidence['output_text_present'] is True
          assert evidence['credential_value_emitted'] is False
          assert evidence['explicit_authorization_observed'] is True
          assert evidence['provider_backed_execution'] == 'PASS'
          assert evidence['metao_final_acceptance'] == 'NOT_TESTED'
          assert evidence['evidence_id']
          assert evidence['payload_digest']
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
