name: Block O Sandbox Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/block-o-sandbox.yml'
      - 'src/metao/**'
      - 'tests/integration/test_o*.py'

jobs:
  o1-langgraph-real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metaO and real LangGraph
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'langgraph==1.2.11'
      - name: O1 real LangGraph through metaO adapter
        run: python tests/integration/test_o1_langgraph_real.py
