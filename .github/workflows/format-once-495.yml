name: Temporary format 495

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        working-directory: experiments/rust-chassis-a
        run: cargo fmt --all
      - name: Commit formatted tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/rust-chassis-a
          git diff --cached --quiet || git commit -m 'chore: format Rust chassis sources'
          git push origin HEAD:
