[package]
name = "metao-testkit"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "metao-testkit-service"
path = "src/metao-testkit-service.rs"

[dependencies]
metao-contracts = { path = "../metao-contracts" }
metao-kernel = { path = "../metao-kernel" }
metao-registry = { path = "../metao-registry" }
metao-wire = { path = "../metao-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
